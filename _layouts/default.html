<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <script>
    try {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (error) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="{{ '/assets/js/theme-switch.js' | relative_url }}" defer></script>
</head>
<body>
  <header class="hero">
    <div class="container">
      <div class="theme-switch" role="group" aria-label="Colour theme">
        <button type="button" data-theme-choice="light">Light</button>
        <button type="button" data-theme-choice="system">Auto</button>
        <button type="button" data-theme-choice="dark">Dark</button>
      </div>
      <p class="hero-prompt">&gt; hello, world_</p>
      <h1>{{ site.title }}</h1>
      <p class="hero-tagline">{{ site.description }}</p>
      <a class="button" href="{{ site.booking_url }}">Book your free place</a>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="container">
      <p>{{ site.title }} &middot; <a href="mailto:{{ site.contact_email }}">{{ site.contact_email }}</a></p>
    </div>
  </footer>
</body>
</html>
